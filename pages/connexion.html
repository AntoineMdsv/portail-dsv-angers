<!doctype html>
<html lang="fr"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Connexion - Portail DSV Angers</title><link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--bg:#f3f5f8;--surface:#fff;--line:#d5dbe5;--fg:#172234;--muted:#5b677a;--ink:#0f2a5c;--accent:#2F80D8;--accent-fg:#ffffff;--bad:#b4232a;--info:#1f56b3;--info-bg:#e3ecfb;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);padding:16px}
.box{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgb(15 42 92 / .08)}
.brand{display:flex;align-items:center;gap:12px;font:700 20px var(--f-display);letter-spacing:.02em;color:var(--ink)}.brand img{width:44px;height:44px;border-radius:8px}.brand small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.06em}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;letter-spacing:.06em}
button{font:600 16px var(--f-body);border:0;border-radius:6px;padding:11px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:0}
.banner{background:var(--info-bg);color:var(--info);border-radius:6px;padding:10px 12px;font-size:14px;margin:0}
.under{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.link{background:none;padding:0;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:2px}
.pw{position:relative;display:block}.pw input{padding-right:44px}input::-ms-reveal,input::-ms-clear{display:none}
button.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:34px;padding:0;background:transparent;color:var(--fg);display:grid;place-items:center}
button.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.credit{position:fixed;left:0;right:0;bottom:12px;margin:0;text-align:center;font-size:11px;opacity:.55}</style><style id="nozoom">html{-webkit-text-size-adjust:100%;text-size-adjust:100%}@media (pointer:coarse),(max-width:900px){input,select,textarea{font-size:16px!important}}</style>
</head><body>
<form class="box" id="f" autocomplete="off">
  <div class="brand"><img src="/logo.png" alt="DSV"><span>PORTAIL<small>DSV ANGERS · PLANNING ET VÉHICULES</small></span></div>
  <p class="banner" id="msg" hidden></p>
  <label>Code personnel<span class="pw"><input id="c" type="password" required autofocus autocomplete="one-time-code" enterkeyhint="go"><button type="button" class="eye" id="eye" aria-label="Afficher le code" title="Afficher / masquer le code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
  <p class="err" id="e" role="alert"></p>
  <button id="b" type="submit">Se connecter</button>
  <div class="under"><button type="button" class="link" id="oubli">Code oublié ?</button></div>
</form>
<p class="credit">Antoine Macé · DSV Angers</p>
<script>
const $=id=>document.getElementById(id);
const info=t=>{$("msg").textContent=t;$("msg").hidden=false};
if(new URLSearchParams(location.search).get("sortie"))info("Vous êtes déconnecté. Un planning ou une flotte resté ouvert dans un autre onglet se ferme dans les 5 minutes.");
$("oubli").onclick=()=>info("Demandez à un administrateur (Antoine) : il vous donnera un nouveau code provisoire, à remplacer par le vôtre à la connexion.");
$("eye").onclick=()=>{const i=$("c"),h=i.type==="password";i.type=h?"text":"password";$("eye").setAttribute("aria-label",h?"Masquer le code":"Afficher le code");i.focus()};
$("f").onsubmit=async ev=>{ev.preventDefault();const b=$("b"),e=$("e");b.disabled=true;e.textContent="";const t0=b.textContent;b.textContent="Connexion…";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("c").value})});
    if(r.ok){const k=await fetch("/api/moi",{cache:"no-store"});if(k.ok){location.replace("/");return}
      e.textContent="Code accepté, mais le navigateur n'a pas gardé la connexion (erreur "+k.status+").";b.disabled=false;b.textContent=t0;return}
    e.textContent=r.status===429?"Trop de codes faux : patientez quelques minutes.":r.status===401?"Code incorrect ou désactivé.":"Erreur du serveur ("+r.status+") : "+(await r.text()).slice(0,200);$("c").select()}
  catch(_){e.textContent="Serveur injoignable : réessayez dans un instant."}
  b.disabled=false;b.textContent=t0};
</script></body></html>
